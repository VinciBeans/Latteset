<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latteset</title>
    <script>
      // 首帧前定主题（roadmap ⑩）：设置要从后端读，来不及；这里只认**上次解析出的**结果，
      // 免得深色用户每次启动先闪一下白屏。键与 src/composables/useTheme.ts 的 THEME_STORAGE_KEY 一致。
      try {
        if (localStorage.getItem("latteset.theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (_) {
        /* 存储被禁：跟随默认（浅色）即可 */
      }
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
