[package]
name = "texpresso-server"
version.workspace = true
edition.workspace = true
description = "无 GUI 交互层：headless 服务（open/compile/errors/outline/synctex）+ CLI 与 MCP 两个二进制（roadmap ⑥）"

[[bin]]
name = "texpresso-cli"
path = "src/bin/texpresso-cli.rs"

[[bin]]
name = "texpresso-mcp"
path = "src/bin/texpresso-mcp.rs"

[dependencies]
texpresso-core = { path = "../crates/../texpresso-core" }
texpresso-infra = { path = "../texpresso-infra" }
serde.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["io-std"] }
tokio-util.workspace = true
thiserror.workspace = true
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
