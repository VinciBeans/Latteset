[package]
name = "latteset-infra"
version.workspace = true
edition.workspace = true
description = "Latteset 基础设施层：文件系统、进程执行（latexmk/synctex CLI）、文件监视、设置存储（无 Tauri、无 UI，ADR-0010）"

[dependencies]
latteset-core = { path = "../latteset-core" }
serde.workspace = true
serde_json = "1"
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
notify.workspace = true
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
