[package]
name = "latteset-server"
version.workspace = true
edition.workspace = true
description = "无 GUI 交互层：headless 服务（open/compile/errors/outline/synctex）+ CLI 与 MCP 两个二进制（roadmap ⑥）"

[[bin]]
name = "latteset-cli"
path = "src/bin/latteset-cli.rs"

[[bin]]
name = "latteset-mcp"
path = "src/bin/latteset-mcp.rs"

[dependencies]
latteset-core = { path = "../crates/../latteset-core" }
latteset-infra = { path = "../latteset-infra" }
# Tectonic **库形态**（路径 B，方案 §3.2 / ADR-0012）：可选依赖 + feature，**默认关**。
# 关着的时候 headless 产物零原生依赖（不拉 freetype2/harfbuzz/ICU/graphite2 的 C 链、不需要 vcpkg）。
# 打开：`cargo build -p latteset-server --features tectonic-lib`（外加运行期开关 LATTESET_TECTONIC_LIB=1）。
# 与 `src-tauri/Cargo.toml` 的形态位同口径（方案 §6 P2 的复核入口就是这条 headless 路径）。
latteset-tectonic = { path = "../latteset-tectonic", optional = true }
serde.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["io-std"] }
tokio-util.workspace = true
thiserror.workspace = true
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
default = []
tectonic-lib = ["dep:latteset-tectonic"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
