[package]
name = "latteset-server"
version.workspace = true
edition.workspace = true
description = "无 GUI 交互层：headless 服务（open/compile/errors/outline/synctex）+ CLI 与 MCP 两个二进制（roadmap ⑥）"

[[bin]]
name = "latteset-cli"
path = "src/bin/latteset-cli.rs"

[[bin]]
name = "latteset-mcp"
path = "src/bin/latteset-mcp.rs"

[dependencies]
latteset-core = { path = "../crates/../latteset-core" }
latteset-infra = { path = "../latteset-infra" }
serde.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["io-std"] }
tokio-util.workspace = true
thiserror.workspace = true
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
