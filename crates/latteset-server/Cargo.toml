[package]
name = "latteset-server"
version.workspace = true
edition.workspace = true
description = "无 GUI 交互层：headless 服务（open/compile/errors/outline/synctex）+ CLI 与 MCP 两个二进制（roadmap ⑥）"

[[bin]]
name = "latteset-cli"
path = "src/bin/latteset-cli.rs"

[[bin]]
name = "latteset-mcp"
path = "src/bin/latteset-mcp.rs"

[dependencies]
latteset-core = { path = "../crates/../latteset-core" }
latteset-infra = { path = "../latteset-infra" }
# Tectonic 内嵌引擎（**唯一形态**，ADR-0015 决策 2）：非可选依赖 ⇒ 自阶段②起 headless 产物也始终
# 带内嵌引擎，构建需要 vcpkg（入口：`scripts/with-tectonic-lib.ps1` / `npm run lib:check`）。
# `network-bundle`：首次编译可联网取默认 bundle（ADR-0016 随包方案留③段再定）。
# 与 `src-tauri/Cargo.toml` 的依赖口径一致（方案 §6 P2 的复核入口就是这条 headless 路径）。
latteset-tectonic = { path = "../latteset-tectonic", features = ["network-bundle"] }
serde.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["io-std"] }
tokio-util.workspace = true
thiserror.workspace = true
tracing = "0.1"
# 与工作区同源：要用 `EnvFilter`（`RUST_LOG` 细调日志级别）就必须带 `env-filter` 特性。
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
