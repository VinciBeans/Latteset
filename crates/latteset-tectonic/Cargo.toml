[package]
name = "latteset-tectonic"
version.workspace = true
edition.workspace = true
description = "Tectonic 库形态引擎（路径 B：自持输出层驱动引擎 crate；ADR-0012 / docs/tectonic-library-plan.md §3.4）"
publish = false

# 依赖来源（docs/tectonic-library-plan.md §3.1 的版本钉定）：
# 走 **crates.io 发布包**。曾先写成 git tag `tectonic@0.17.0`（7141d67a…），但实测在本机 Windows
# （默认 MAX_PATH）**取不下来**：cargo 会对 git 依赖 init 子模块，报
#   failed to update submodule `crates/bridge_harfbuzz/harfbuzz`
#   → path too long: '.../harfbuzz/test/subset/data/expected/cff-full-font/SourceSansPro-Regular.
#     notdef-outline-drop-hints-desubroutinize-retain-gids.1FC,21,41,20,62,63.otf'
# （`core.longpaths=true` 经 GIT_CONFIG_* 传入也不解除）。
# 发布包**内含** vendored harfbuzz 源码、无子模块（方案 §3.1.3 / §5.5），因此改用它。
[dependencies]
latteset-core = { path = "../latteset-core" }
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing = "0.1"

# 版本**照抄上游 0.17.0 自己的 `Cargo.lock`**（`test_file/tectonic-src/Cargo.lock`），不是猜的：
#   bridge_core 0.5.3 / bundles 0.4.2 / engine_xdvipdfmx 0.4.4 / engine_xetex 0.5.3 /
#   errors 0.3.0 / io_base 0.6.0 / status_base 0.2.2 / xdv 0.3.0
# ⚠ 教训：先前按"猜的一组"（bridge_core 0.2.2 等）钉，导致 `tectonic_xetex_layout 0.3.4`
# 调不到 `CoreBridgeState::with_global_state`（0.2.2 只有 `with_global_lock`）—— 子 crate 必须整代一致。
tectonic_bridge_core = "0.5.3"
tectonic_bundles = { version = "0.4.2", default-features = false }
tectonic_engine_xdvipdfmx = "0.4.4"
tectonic_engine_xetex = "0.5.3"
tectonic_errors = "0.3.0"
tectonic_io_base = "0.6.0"
tectonic_status_base = "0.2.2"
tectonic_xdv = "0.3.0"

[features]
default = []
# 网络 bundle 后端（`tectonic_bundles` 的 `geturl-reqwest`）。**默认关**：方案 §4.2 的 X-2
# 选 (a)「default-features = false 关掉 HTTP」——bundle 的获取与缓存口径（本地 bundle / 目录 /
# file:// / 网络）属后续阶段（t10 的 P3）。打开它会引入 reqwest 依赖链。
network-bundle = ["tectonic_bundles/geturl-reqwest"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
