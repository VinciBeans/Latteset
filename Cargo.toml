[workspace]
resolver = "2"
members = ["src-tauri", "crates/latteset-core", "crates/latteset-infra", "crates/latteset-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
thiserror = "2"
regex = "1"
notify = "8.2"
# 日志门面（roadmap ㉛）：core 也要能打"编译决策"日志（facade 不是 IO，ADR-0006 仍成立）
tracing = "0.1"
