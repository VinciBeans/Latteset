[workspace]
resolver = "2"
members = ["src-tauri", "crates/latteset-core", "crates/latteset-infra", "crates/latteset-server", "crates/latteset-tectonic"]
# 自阶段②起**所有构建都需要 vcpkg**（ADR-0015 决策 2：Tectonic 内嵌是唯一形态）：
# `crates/latteset-tectonic` 承载 Tectonic 的 C/C++ 链（freetype2/graphite2/harfbuzz/ICU/fontconfig/libpng
# 走外部探测，探测失败即 build script panic ⇒ 需要 vcpkg），且已被 `src-tauri` / `latteset-server`
# 以**非可选依赖**引入 ⇒ 不带 `-p` 的根 `cargo build/check/test` 也会构建它。
# 构建环境统一走唯一入口 `scripts/with-tectonic-lib.ps1`（`npm run lib:check` 先自检前置）。
# 开发期本地素材（Tectonic 上游 checkout 等）**不是**本 workspace 的成员：那份清单自带
# `[workspace]` 与 `lints.workspace = true`，一旦被当成成员就会去继承**本仓**根清单的
# `workspace.lints`（本仓没定义）而解析失败。
exclude = ["test_file/tectonic-src"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
thiserror = "2"
regex = "1"
notify = "8.2"
# 日志门面（roadmap ㉛）：core 也要能打"编译决策"日志（facade 不是 IO，ADR-0006 仍成立）
tracing = "0.1"
# 日志实现（只在二进制/壳里装配）。`env-filter` 是给 `RUST_LOG` 用的：`latteset-cli` /
# `latteset-mcp` / GUI 都按"默认 info、可用 RUST_LOG 细调"同一口径，否则冷编译诊断
# （`latteset_tectonic=debug` 那些"钱花在哪一趟"的读数）在 CLI 上会被级别挡掉。
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
