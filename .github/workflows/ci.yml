name: CI

# 按 docs/archive/architecture.md §8 / ADR-0003 + ADR-0015 决策 2 落地：
#   ① Ubuntu `check`：前端质量门 + core/infra 纯 Rust 测试（不碰 native C 链）；
#   ② Windows `build-windows`：**内嵌 Tectonic 是唯一形态** ⇒ 装 vcpkg 六个端口，跑全量 Rust
#      测试（含 headless/server 与内嵌 crate）+ NSIS 打包冒烟（验证 ADR-0003 分发链路）。
# 阶段②起不再有单独的 `build-windows-tectonic-lib` 档：内嵌档就是默认档（D5）。
# 仓库真源：**GitHub 为 truth、Gitee 为镜像**（见 .github/workflows/sync-gitee.yml 与 docs/README.md）；
# 早前这里写的"origin 是 Gitee"已过期（2026-09 审计核对 `git remote -v`）。
on:
  push:
    branches: [master]
    # 版本 tag 与 push 走同一套档（已没有"只在 tag/手动跑的库形态发布档"）。
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    name: Type-check & core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      # 文档化的前端质量门：vue-tsc --noEmit + vite build（含 copy:pdf-worker）。
      # 此步曾因 strict-null 回归而失败，现已修复。
      - name: Frontend type-check & build
        run: npm run build

      # 前端单测（vitest）：stores 路径归一化、editor 自保存过滤/冲突、useAutoSave 防抖。
      # docs/archive/architecture.md §8「MVP 后补 vitest + @vue/test-utils」。
      - name: Frontend unit tests
        run: npm run test

      # core 纯逻辑（调度器合并/超时/重试/终止、日志解析快照、设置合并、根文件探测）。
      # 无 Tauri/无 GUI 依赖，Linux 可跑；不运行 #[ignore] 的真实 TeX 集成测试。
      - name: Core tests
        run: cargo test -p latteset-core

      # infra（文件系统实现 / 监视 / 设置存储 / synctex 提供者）。阶段②删掉子进程 runner 后
      # 这里只剩不依赖 native C 链的模块，Linux 可跑。
      # 真实 TeX/内嵌编译的集成用例都带 #[ignore]，默认不跑。
      - name: Infra tests
        run: cargo test -p latteset-infra

      # ⚠ headless（latteset-server）用例自阶段②起**不在这里跑**：server 已非可选依赖内嵌
      # Tectonic，Linux 上会去探测 pkg-config 的 C 链（R11 决策：挪到 Windows 档，不补 Linux
      # 原生依赖）。对应步骤见 `build-windows` 的 `-Mode test`。

  build-windows:
    name: "Windows build (embedded engine: tests + NSIS smoke)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      # 依赖图只剩一份（内嵌唯一），不再需要原库形态档的 `key: tectonic-lib`。
      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      # vcpkg 检出**钉 rev**（与 `.gitignore` 的复现命令、`test_file/tectonic-src/Cargo.toml` 的
      # [package.metadata.vcpkg] rev 一致）：内嵌 Tectonic 的 C 链按这个 rev 的 ports 构建。
      # ⚠ VCPKG_ROOT 只能在**步骤级**设（job 级 env 不允许引用 `runner` 上下文，用了会让整个
      #    workflow 文件校验失败、0 秒红）；步骤间传递走 `$GITHUB_ENV`。
      - name: Checkout vcpkg (pinned)
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone https://github.com/microsoft/vcpkg $vcpkgRoot
          if ($LASTEXITCODE -ne 0) { throw "git clone vcpkg 失败（exit $LASTEXITCODE）" }
          git -C $vcpkgRoot checkout a62ce77d56ee07513b4b67de1ec2daeaebfae51a
          if ($LASTEXITCODE -ne 0) { throw "vcpkg checkout 失败（exit $LASTEXITCODE）" }
          & "$vcpkgRoot/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap 失败（exit $LASTEXITCODE）" }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 冷装六个端口要数分钟，所以缓存 `installed/`（装好的静态库）与 `downloads/`（源码包）。
      # key 含 triplet 与 pin rev ⇒ 换 rev / 换 triplet 自动失效、不会串味。
      - name: Cache vcpkg installed ports
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg/installed
            ${{ runner.temp }}/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-x64-windows-static-release-a62ce77d
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-static-release-

      # 六个直接端口（传递依赖由 vcpkg 自己拉：brotli / bzip2 / dirent / expat / zlib）。
      # 命中缓存时 vcpkg 直接判定"已安装"，只剩校验开销。
      - name: Install vcpkg ports (Tectonic C chain)
        shell: pwsh
        run: |
          $env:VCPKG_DEFAULT_TRIPLET = 'x64-windows-static-release'
          $env:VCPKG_DEFAULT_HOST_TRIPLET = 'x64-windows-static-release'
          & "$env:VCPKG_ROOT/vcpkg.exe" install freetype harfbuzz graphite2 icu fontconfig libpng --triplet x64-windows-static-release
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install 失败（exit $LASTEXITCODE）" }

      # 前置校验走产品自己的唯一入口（单一落点）——失败时给的是可执行修复命令，
      # 不是 vcpkg-rs / build script 的 panic。
      - name: Check build prerequisites
        shell: pwsh
        run: ./scripts/with-tectonic-lib.ps1 -Mode check

      # 全量 Rust 测试（core / infra / headless-server / 内嵌 tectonic crate）。
      # 原 Ubuntu 档的 headless 用例、原 `build-windows-tectonic-lib` 档的库形态单测都并到这里。
      - name: Rust tests (all crates, embedded engine)
        shell: pwsh
        run: ./scripts/with-tectonic-lib.ps1 -Mode test

      # Windows 首发平台完整打包冒烟：内嵌形态是唯一形态，与本地开发走同一个入口
      # （beforeBuildCommand 会自动跑前端 build，产物含 NSIS 安装包，ADR-0003）。
      # 真实 TeX 集成测试为 #[ignore]，不在此触发。
      - name: Tauri build (NSIS installer)
        shell: pwsh
        run: ./scripts/with-tectonic-lib.ps1 -Mode tauri build
