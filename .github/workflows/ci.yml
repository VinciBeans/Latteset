name: CI

# 按 docs/archive/architecture.md §8 / ADR-0003 + ADR-0015 决策 2 落地：
#   ① Ubuntu `check`：前端质量门 + core/infra 纯 Rust 测试（不碰 native C 链）；
#   ② Windows `build-windows`：**内嵌 Tectonic 是唯一形态** ⇒ 装 vcpkg 六个端口，跑全量 Rust
#      测试（含 headless/server 与内嵌 crate）+ NSIS 打包冒烟（验证 ADR-0003 分发链路）。
# 阶段②起不再有单独的 `build-windows-tectonic-lib` 档：内嵌档就是默认档（D5）。
# 仓库真源：**GitHub 为 truth、Gitee 为镜像**（见 .github/workflows/sync-gitee.yml 与 docs/README.md）；
# 早前这里写的"origin 是 Gitee"已过期（2026-09 审计核对 `git remote -v`）。
on:
  push:
    branches: [master]
    # 版本 tag 与 push 走同一套档（已没有"只在 tag/手动跑的库形态发布档"）。
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    name: Type-check & core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      # 文档化的前端质量门：vue-tsc --noEmit + vite build（含 copy:pdf-worker）。
      # 此步曾因 strict-null 回归而失败，现已修复。
      - name: Frontend type-check & build
        run: npm run build

      # 前端单测（vitest）：stores 路径归一化、editor 自保存过滤/冲突、useAutoSave 防抖。
      # docs/archive/architecture.md §8「MVP 后补 vitest + @vue/test-utils」。
      - name: Frontend unit tests
        run: npm run test

      # core 纯逻辑（调度器合并/超时/重试/终止、日志解析快照、设置合并、根文件探测）。
      # 无 Tauri/无 GUI 依赖，Linux 可跑；不运行 #[ignore] 的真实 TeX 集成测试。
      - name: Core tests
        run: cargo test -p latteset-core

      # infra（文件系统实现 / 监视 / 设置存储 / synctex 提供者）。阶段②删掉子进程 runner 后
      # 这里只剩不依赖 native C 链的模块，Linux 可跑。
      # 真实 TeX/内嵌编译的集成用例都带 #[ignore]，默认不跑。
      - name: Infra tests
        run: cargo test -p latteset-infra

      # ⚠ headless（latteset-server）用例自阶段②起**不在这里跑**：server 已非可选依赖内嵌
      # Tectonic，Linux 上会去探测 pkg-config 的 C 链（R11 决策：挪到 Windows 档，不补 Linux
      # 原生依赖）。对应步骤见 `build-windows` 的 `-Mode test`。

  build-windows:
    name: "Windows build (embedded engine: tests + NSIS smoke)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      # 依赖图只剩一份（内嵌唯一），不再需要原库形态档的 `key: tectonic-lib`。
      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      # vcpkg 检出**钉 rev**（与 `.gitignore` 的复现命令、`test_file/tectonic-src/Cargo.toml` 的
      # [package.metadata.vcpkg] rev 一致）：内嵌 Tectonic 的 C 链按这个 rev 的 ports 构建。
      # ⚠ VCPKG_ROOT 只能在**步骤级**设（job 级 env 不允许引用 `runner` 上下文，用了会让整个
      #    workflow 文件校验失败、0 秒红）；步骤间传递走 `$GITHUB_ENV`。
      - name: Checkout vcpkg (pinned)
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone https://github.com/microsoft/vcpkg $vcpkgRoot
          if ($LASTEXITCODE -ne 0) { throw "git clone vcpkg 失败（exit $LASTEXITCODE）" }
          git -C $vcpkgRoot checkout a62ce77d56ee07513b4b67de1ec2daeaebfae51a
          if ($LASTEXITCODE -ne 0) { throw "vcpkg checkout 失败（exit $LASTEXITCODE）" }
          & "$vcpkgRoot/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap 失败（exit $LASTEXITCODE）" }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 冷装六个端口要数分钟，所以缓存 `installed/`（装好的静态库）与 `downloads/`（源码包）。
      # key 含 triplet 与 pin rev ⇒ 换 rev / 换 triplet 自动失效、不会串味。
      - name: Cache vcpkg installed ports
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg/installed
            ${{ runner.temp }}/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-x64-windows-static-release-a62ce77d
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-static-release-

      # 六个直接端口（传递依赖由 vcpkg 自己拉：brotli / bzip2 / dirent / expat / zlib）。
      # 命中缓存时 vcpkg 直接判定"已安装"，只剩校验开销。
      - name: Install vcpkg ports (Tectonic C chain)
        shell: pwsh
        run: |
          $env:VCPKG_DEFAULT_TRIPLET = 'x64-windows-static-release'
          $env:VCPKG_DEFAULT_HOST_TRIPLET = 'x64-windows-static-release'
          & "$env:VCPKG_ROOT/vcpkg.exe" install freetype harfbuzz graphite2 icu fontconfig libpng --triplet x64-windows-static-release
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install 失败（exit $LASTEXITCODE）" }

      # 前置校验走产品自己的唯一入口（单一落点）——失败时给的是可执行修复命令，
      # 不是 vcpkg-rs / build script 的 panic。
      - name: Check build prerequisites
        shell: pwsh
        run: ./scripts/with-tectonic-lib.ps1 -Mode check

      # B2（T22 review）：release CLI 是下面两处的**共同前置**，必须在两条缓存路径上都存在：
      #   ① `Restore or regenerate representative bundle` 的未命中分支（gen-bench-bundle 要 `latteset-cli`）；
      #   ② `Offline first compile`（直接执行 `src-tauri/target/release/latteset-cli.exe`）。
      # 之前只在①的分支里构建 ⇒ **代表集缓存命中但 rust-cache 没有 release 产物时，②必红**。
      # 所以提到这里无条件构建一次（命中 rust-cache 时 cargo 增量、仅秒级）。
      - name: Build release CLI (bundle gen + offline first compile prerequisite)
        shell: pwsh
        run: ./scripts/with-tectonic-lib.ps1 -Mode cli

      # ---------------- T16：随包产品精简宏包集（ADR-0016 候选 A）----------------
      # 代表集是 517 文件 / 52 MiB（gitignore，可从上游 bundle 按需取文件重建）。CI 缓存它，
      # 缓存键带**内容版本 token**；命中后还要用 digest 核对，避免"旧缓存混进发行物"。
      - name: Cache representative bundle
        uses: actions/cache@v4
        with:
          path: test_file/tectonic-bundle
          key: bench-bundle-v33-9e8c63ca-${{ runner.os }}
          restore-keys: |
            bench-bundle-v33-

      # 代表集重建需要 11 个基准夹具（六档 + beamer + biblatex/biber + biblatex/bibtex，均 gitignore）。
      # 干净 checkout 上它们不存在 ⇒ 必须先由入库脚本确定性生成；否则缓存未命中时重建必红（首跑即此因）。
      - name: Generate bench fixtures (bundle regeneration prerequisite)
        shell: pwsh
        run: |
          node scripts/gen-bench-projects.mjs
          if ($LASTEXITCODE -ne 0) { throw "gen-bench-projects 失败" }

      - name: Restore or regenerate representative bundle
        shell: pwsh
        run: |
          $expected = '9e8c63ca5624438fba4bf4587afbfe3ddcfb82745769970ca2fe1f3ea392fde6'
          $sumFile = 'test_file/tectonic-bundle/SHA256SUM'
          $have = if (Test-Path $sumFile) { (Get-Content $sumFile -Raw).Trim() } else { '' }
          if ($have -ne $expected) {
            Write-Host "代表集缺失或 digest=$have ≠ $expected ⇒ 从上游 bundle 重建（需联网，5–15 分钟）"
            # release CLI 已由上面的 `Build release CLI` 步骤无条件构建（B2），这里不再重复构建。
            node scripts/gen-bench-bundle.mjs --phase=gen
            if ($LASTEXITCODE -ne 0) { throw "gen-bench-bundle --phase=gen 失败" }
            node scripts/gen-bench-bundle.mjs --phase=install
            if ($LASTEXITCODE -ne 0) { throw "gen-bench-bundle --phase=install 失败" }
          } else {
            Write-Host "代表集缓存命中（digest=$have）"
          }

      # 产品 zip（随安装包）：确定性打包 + 自校验 + 体积上限（≤120 MiB 原始 zip；安装包总上限 200 MB 另测）
      - name: Pack product bundle (zip)
        shell: pwsh
        run: |
          node scripts/make-bundle.mjs --max-zip-mb=120
          if ($LASTEXITCODE -ne 0) { throw "make-bundle 失败" }
          node scripts/make-bundle.mjs --verify
          if ($LASTEXITCODE -ne 0) { throw "make-bundle --verify 失败" }

      # T21（G-L3）：第三方声明 / 许可全文 / GPL 字体 Corresponding Source 必须与随包物一致，
      # 且随安装包分发（tauri.conf resources 已带 licenses/）。--check 是纯离线确定性比对。
      - name: Check third-party notices (G-L3)
        shell: pwsh
        run: |
          node scripts/make-notices.mjs --check
          if ($LASTEXITCODE -ne 0) { throw "make-notices --check 失败" }
          $lic = 'src-tauri/resources/licenses'
          if (-not (Test-Path "$lic/THIRD-PARTY-NOTICES.md")) { throw "缺 THIRD-PARTY-NOTICES.md" }
          if (-not (Test-Path "$lic/manifest.json")) { throw "缺 licenses/manifest.json" }
          $cid = @(Get-ChildItem "$lic/sources/fandol" -Recurse -File | Where-Object { $_.Name -eq 'cidfont.ps' })
          if ($cid.Count -lt 6) { throw "Fandol Corresponding Source 不全（cidfont.ps $($cid.Count)/6）" }
          if (-not (Test-Path "$lic/sources/zapfding/pzdr.afm")) { throw "缺 zapfding AFM 源码" }
          $bytes = (Get-ChildItem $lic -Recurse -File | Measure-Object Length -Sum).Sum
          $files = (Get-ChildItem $lic -Recurse -File | Measure-Object).Count
          Write-Host ("licenses+sources = {0:N2} MiB / {1} files" -f ($bytes / 1MB), $files)
          if ($bytes -gt 80MB) { throw "licenses/sources 体积 {0:N2} MiB 超 80 MiB 预算（T21）" -f ($bytes / 1MB) }

      # 离线首编验收（docs/dev/testing.md 的 CI 版）：内置精简集 + 空缓存 + **不可用代理**
      # ⇒ 能编过 = 全程没走网络（ADR-0016 候选 A 的"离线开箱"判据）。
      - name: Offline first compile with shipped bundle
        shell: pwsh
        run: |
          $proj = Join-Path $env:RUNNER_TEMP 'offline-first'
          New-Item -ItemType Directory -Force $proj | Out-Null
          Set-Content -Path (Join-Path $proj 'main.tex') -Encoding utf8 -Value @'
          \documentclass[UTF8]{ctexart}
          \begin{document}
          断网首编：你好，Latteset。\par
          {\heiti 黑体} {\kaishu 楷体} {\fangsong 仿宋} {\bfseries 加粗}
          \end{document}
          '@
          $zip = (Resolve-Path 'src-tauri/resources/tectonic-bundle.zip').Path.Replace('\','/')
          $env:LATTESET_TECTONIC_BUNDLE = "file:///$zip"
          $env:LATTESET_TECTONIC_CACHE = Join-Path $env:RUNNER_TEMP 'offline-cache'
          $env:HTTPS_PROXY = 'http://127.0.0.1:9'
          $env:HTTP_PROXY = 'http://127.0.0.1:9'
          $env:TMP = $env:RUNNER_TEMP
          $env:TEMP = $env:RUNNER_TEMP
          $out = & (Resolve-Path 'src-tauri/target/release/latteset-cli.exe').Path --project $proj compile
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { throw "离线首编失败（exit $code）" }
          $pdf = Join-Path $proj 'main.pdf'
          if (-not (Test-Path $pdf)) { throw "离线首编没有产出 PDF" }
          node scripts/validate-pdf.mjs --pdf $pdf --expect-pages 1 --expect-text '你好' --expect-text '黑体'
          if ($LASTEXITCODE -ne 0) { throw "validate-pdf 未通过" }

      # 全量 Rust 测试（core / infra / headless-server / 内嵌 tectonic crate）。
      # 原 Ubuntu 档的 headless 用例、原 `build-windows-tectonic-lib` 档的库形态单测都并到这里。
      - name: Rust tests (all crates, embedded engine)
        shell: pwsh
        run: ./scripts/with-tectonic-lib.ps1 -Mode test

      # Windows 首发平台完整打包冒烟：内嵌形态是唯一形态，与本地开发走同一个入口
      # （beforeBuildCommand 会自动跑前端 build，产物含 NSIS 安装包，ADR-0003）。
      # 真实 TeX 集成测试为 #[ignore]，不在此触发。
      - name: Tauri build (NSIS installer)
        shell: pwsh
        run: ./scripts/with-tectonic-lib.ps1 -Mode tauri build

      # T16 体积门禁（ADR-0016 候选 A）：安装包 ≤200 MB（产品负责人 2026-11-20 给的数），
      # 同时打印"随包 bundle zip / 安装包 / 二者差"的实测账（发布记录用）。
      - name: Record installer size (gate ≤200 MB)
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "找不到 NSIS 安装包（tauri build 没产出？）" }
          $bundleZip = Get-Item 'src-tauri/resources/tectonic-bundle.zip'
          $limit = 200MB
          $mb = { param($b) [math]::Round($b / 1MB, 2) }
          Write-Host ("NSIS installer: {0} = {1} MiB" -f $installer.Name, (& $mb $installer.Length))
          Write-Host ("shipped bundle : {0} = {1} MiB" -f $bundleZip.Name, (& $mb $bundleZip.Length))
          if ($installer.Length -gt $limit) {
            throw ("安装包 {0} MiB > 上限 200 MB（T16 体积门禁）" -f (& $mb $installer.Length))
          }
          @{ installer = $installer.Length; bundleZip = $bundleZip.Length; limit = $limit } |
            ConvertTo-Json | Set-Content -Path 'test_file/phase3/installer-size.json' -Encoding utf8
