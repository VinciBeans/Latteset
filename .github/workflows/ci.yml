name: CI

# 按 architecture.md §8 / ADR-0003 落地：
#   cargo test + vue-tsc --noEmit + Windows runner tauri build 冒烟（验证 NSIS 打包链路）。
# 注意：本仓库当前 origin 是 Gitee；GitHub Actions 需要镜像到 GitHub 才会触发。
# 若只用 Gitee，请改用 Gitee Go（语法相近，见 docs 说明）。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Type-check & core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      # 文档化的前端质量门：vue-tsc --noEmit + vite build（含 copy:pdf-worker）。
      # 此步曾因 strict-null 回归而失败，现已修复。
      - name: Frontend type-check & build
        run: npm run build

      # 前端单测（vitest）：stores 路径归一化、editor 自保存过滤/冲突、useAutoSave 防抖。
      # architecture.md §8「MVP 后补 vitest + @vue/test-utils」。
      - name: Frontend unit tests
        run: npm run test

      # core 纯逻辑（调度器合并/超时/重试/终止、日志解析快照、设置合并、根文件探测）。
      # 无 Tauri/无 GUI 依赖，Linux 可跑；不运行 #[ignore] 的真实 TeX 集成测试。
      - name: Core tests
        run: cargo test -p latteset-core

  build-windows:
    name: Windows build (NSIS smoke)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      # Windows 首发平台完整打包冒烟：beforeBuildCommand 会自动跑前端 build，
      # 产物含 NSIS 安装包（ADR-0003 分发路径）。真实 TeX 集成测试为 #[ignore]，不在此触发。
      #
      # ⚠ 这一档**不带** tectonic-lib：主产物保持零原生依赖，构建不需要 vcpkg。
      #    带库形态的发布构建在下面 `build-windows-tectonic-lib` 一档。
      - name: Tauri build (NSIS installer)
        run: npm run tauri build

  # Tectonic 库形态（路径 B，ADR-0012）是**正式的构建变体**：发布产物要同时具备两种形态
  # （子进程 / 库内嵌，由设置面选），所以这一档必须在 CI 里存在 —— 否则用户装到的包根本没有库形态。
  #
  # 触发面刻意收窄（workflow_dispatch + tag）：它要装整套 vcpkg 端口，冷构建约 +15–20 min
  # （t4 §7 的参照），挂在每次 push 上会把常规反馈拖慢一个量级。发布前手动或打 tag 触发。
  #
  # 本档**只管"带库形态的发布构建能不能成"**：装依赖 → 产品自己的前置校验 → 库形态单测 →
  # `tauri build --features tectonic-lib`。真编文档的端到端门禁不在这里 —— 它还要 bundle
  # （目录 bundle 需自带 SHA256SUM）与网络口径，那两件在 P2/P3 的复核入口里做（见方案 §6）。
  build-windows-tectonic-lib:
    name: Windows build (tectonic-lib variant)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    env:
      VCPKG_ROOT: ${{ runner.temp }}/vcpkg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # 库形态的依赖图与默认构建不同（多整棵 tectonic + C 链），单独一份缓存。
          key: tectonic-lib

      - name: Install frontend dependencies
        run: npm ci

      # vcpkg 检出 + 六个直接端口（传递依赖由 vcpkg 自己拉：brotli / bzip2 / dirent / expat / zlib）。
      # 端口清单与本机验证过的 triplet 口径见 docs/tectonic-library-plan.md §3.1.3。
      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          $env:VCPKG_DEFAULT_TRIPLET = 'x64-windows-static-release'
          $env:VCPKG_DEFAULT_HOST_TRIPLET = 'x64-windows-static-release'
          & "$env:VCPKG_ROOT/vcpkg.exe" install freetype harfbuzz graphite2 icu fontconfig libpng --triplet x64-windows-static-release
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install 失败（exit $LASTEXITCODE）" }

      # 前置校验走产品自己的脚本（单一落点）——失败时给的是可执行文案，不是 build script panic。
      - name: Check tectonic-lib prerequisites
        shell: pwsh
        run: ./scripts/with-tectonic-lib.ps1 -Mode check

      - name: tectonic-lib unit tests
        shell: pwsh
        run: ./scripts/with-tectonic-lib.ps1 -Mode test

      # 本档的**核心断言**：带库形态的发布构建成立（含 NSIS 打包）。
      - name: Tauri build with the library form
        shell: pwsh
        run: ./scripts/with-tectonic-lib.ps1 -Mode build
