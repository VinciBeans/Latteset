name: Sync to Gitee

# GitHub 为 truth：每次推送到 master / 打标签后，把内容镜像到 Gitee。
# 方向：GitHub → Gitee（单向），运行在 GitHub runner 上，无需本地 VPN。
#
# 需要的 GitHub secret（Settings → Secrets and variables → Actions）：
#   GITEE_TOKEN  必填：Gitee 个人访问令牌（https://gitee.com/profile/personal_access_tokens），
#                需勾选 projects（项目写）权限，以 `用户名:令牌` 作为 basic auth 推送。
#   GITEE_USER   可选：Gitee 登录用户名；未设置时默认为 wenqibian。
#
# 未配置 GITEE_TOKEN 时本 job 会打印提示并直接成功退出（不会报红）。

on:
  push:
    branches: [master]
    tags: ["*"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee (mirror GitHub -> Gitee)
        env:
          GITEE_USER: ${{ secrets.GITEE_USER || 'wenqibian' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN 未配置，跳过 Gitee 同步"
            exit 0
          fi
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/wenqibian/Latteset.git"
          git push --force --all gitee
          git push --force --tags gitee
