[package]
name = "latteset"
version.workspace = true
description = "Latteset：本地运行的 TeX 完整 IDE（实时编译）"
authors = ["Latteset"]
edition.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "latteset_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
latteset-core = { path = "../crates/latteset-core" }
latteset-infra = { path = "../crates/latteset-infra" }
serde.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing = "0.1"
tracing-subscriber = "0.3"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-mcp-bridge = "0.13"

# Tectonic **库形态**（路径 B，方案 §3.2 / ADR-0012）：可选依赖 + feature，**默认关**。
# 关着的时候主产物零原生依赖（不拉 freetype2/harfbuzz/ICU/graphite2 的 C 链、不需要 vcpkg）。
# 打开：`cargo build -p latteset --features tectonic-lib`（外加运行期开关 LATTESET_TECTONIC_LIB=1）。
latteset-tectonic = { path = "../crates/latteset-tectonic", optional = true }

[features]
default = []
tectonic-lib = ["dep:latteset-tectonic"]
