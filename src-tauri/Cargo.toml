[package]
name = "latteset"
version.workspace = true
description = "Latteset：本地运行的 TeX 完整 IDE（实时编译）"
authors = ["Latteset"]
edition.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "latteset_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
latteset-core = { path = "../crates/latteset-core" }
latteset-infra = { path = "../crates/latteset-infra" }
# `SwitchableRunner` 要 impl `CompileRunner`（`#[async_trait]`）——宏依赖，不引 C。
async-trait.workspace = true
tokio-util.workspace = true
serde.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing = "0.1"
tracing-subscriber = "0.3"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-mcp-bridge = "0.13"

# Tectonic **库形态**（路径 B，方案 §3.2 / ADR-0012）：可选依赖 + feature，**默认关**。
# 关着的时候主产物零原生依赖（不拉 freetype2/harfbuzz/ICU/graphite2 的 C 链、不需要 vcpkg）。
# 打开：`cargo build -p latteset --features tectonic-lib`（外加运行期开关 LATTESET_TECTONIC_LIB=1）。
latteset-tectonic = { path = "../crates/latteset-tectonic", optional = true }

# 原生标题栏的深色（DWM 沉浸式深色）。**为什么不用 tauri 的 `set_theme` 就够了**：
# 实测（Windows 11 / tauri 2.11.5）`set_theme(Dark)` 能开，`set_theme(Light)` **关不掉** ——
# 命令返回 Ok，但 `DWMWA_USE_IMMERSIVE_DARK_MODE` 仍是 1（标题栏卡在深色）。所以自己写这个属性。
# 版本与 lock 里已有的 `windows`（tao 拉的）对齐，避免编进第二份。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[features]
default = []
tectonic-lib = ["dep:latteset-tectonic"]
